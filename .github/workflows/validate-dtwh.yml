name: Validate DTWH dashboards
on:
  push:
    branches: [deploy/streamlit-cloud]
    paths:
      - "bi/streamlit/**"
      - "data/bi_serving/**"
      - ".github/workflows/validate-dtwh.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r bi/streamlit/requirements.txt
      - name: Validate syntax and BI mart
        run: |
          python -m py_compile bi/streamlit/app.py bi/streamlit/data_access.py
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"bi/streamlit")
          from data_access import connect
          con, available = connect(Path.cwd())
          assert len(available) == 8
          rows, positive = con.execute(
              "SELECT COUNT(*), SUM(CASE WHEN TARGET=1 THEN 1 ELSE 0 END) "
              "FROM application_dashboard"
          ).fetchone()
          assert rows == 356255, rows
          assert positive == 24825, positive
          statuses = con.execute(
              "SELECT DISTINCT CAST(STATUS AS VARCHAR) "
              "FROM bureau_month_status"
          ).fetchall()
          assert set(s[0] for s in statuses) == set("012345CX")
          print("PASS: syntax, source marts, application KPI, Bureau statuses")
          PY
      - name: Streamlit app smoke tests
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("bi/streamlit/app.py").run(timeout=120)
          if len(app.exception):
              raise RuntimeError(str(app.exception))
          assert len(app.sidebar.radio) >= 1
          app.sidebar.radio[0].set_value("2. Lịch sử tín dụng").run(timeout=120)
          if len(app.exception):
              raise RuntimeError(str(app.exception))
          print("PASS: both dashboard pages")
          PY
